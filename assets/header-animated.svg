<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="50%" stop-color="#17101c" />
      <stop offset="100%" stop-color="#0d1b24" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef0574">
        <animate attributeName="stop-color" values="#ef0574;#1d889b;#bc2035;#ef0574" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff9979">
        <animate attributeName="stop-color" values="#ff9979;#ef0574;#2494a5;#ff9979" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1d889b">
        <animate attributeName="stop-color" values="#1d889b;#bc2035;#ef0574;#1d889b" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef0574" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#1d889b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#bc2035" stop-opacity="0.20" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="960" height="240" rx="16" fill="url(#bgGrad)" stroke="#262936" stroke-width="2" />

  <!-- Animated background waves -->
  <path fill="url(#waveGrad1)" d="M0,175 Q240,130 480,175 T960,165 L960,240 L0,240 Z">
    <animate attributeName="d"
      values="M0,175 Q240,130 480,175 T960,165 L960,240 L0,240 Z;
              M0,165 Q240,210 480,160 T960,180 L960,240 L0,240 Z;
              M0,175 Q240,130 480,175 T960,165 L960,240 L0,240 Z"
      dur="7s" repeatCount="indefinite" />
  </path>

  <path fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.55" d="M0,190 Q240,145 480,190 T960,180">
    <animate attributeName="d"
      values="M0,190 Q240,145 480,190 T960,180;
              M0,178 Q240,220 480,175 T960,195;
              M0,190 Q240,145 480,190 T960,180"
      dur="5.5s" repeatCount="indefinite" />
  </path>

  <!-- Floating animated particles -->
  <circle cx="140" cy="65" r="3" fill="#ef0574" opacity="0.7">
    <animate attributeName="cy" values="65;42;65" dur="3.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="820" cy="75" r="3.5" fill="#1d889b" opacity="0.7">
    <animate attributeName="cy" values="75;48;75" dur="4.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.95;0.4" dur="4.1s" repeatCount="indefinite" />
  </circle>
  <circle cx="740" cy="145" r="2.5" fill="#ff9979" opacity="0.7">
    <animate attributeName="cy" values="145;118;145" dur="3.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="210" cy="150" r="2.5" fill="#2494a5" opacity="0.7">
    <animate attributeName="cy" values="150;124;150" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <!-- Top status pill -->
  <g transform="translate(310, 26)">
    <rect width="340" height="28" rx="14" fill="#141824" stroke="#2c3548" stroke-width="1.2" />
    <circle cx="20" cy="14" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="18" fill="#cbd5e1" font-family="'Segoe UI', Ubuntu, monospace" font-size="11.5" font-weight="700" letter-spacing="1.4">
      WHATSAPP MULTI-DEVICE BOT · BAILEYS
    </text>
  </g>

  <!-- Main Animated Title -->
  <text x="480" y="114" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="54" font-weight="900" letter-spacing="4" filter="url(#glow)">
    SOUL-LIST
  </text>

  <!-- Animated underline bar -->
  <rect x="330" y="128" width="300" height="4" rx="2" fill="url(#accentGrad)">
    <animate attributeName="width" values="220;320;220" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="370;320;370" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Subtitle -->
  <text x="480" y="160" text-anchor="middle" fill="#e2e8f0" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="15.5" font-weight="600" letter-spacing="0.8">
    ⚡ +1.400 Comandos · TypeScript · SQLite + Drizzle · Sistema Modular de Plugins
  </text>

  <text x="480" y="216" text-anchor="middle" fill="#94a3b8" font-family="'Segoe UI', Ubuntu, monospace" font-size="12" font-weight="600" letter-spacing="1.5">
    DESENVOLVIDO POR LLEWXAM (@LlewxamDev)
  </text>
</svg>
